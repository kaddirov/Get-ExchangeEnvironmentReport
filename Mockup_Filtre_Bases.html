<!DOCTYPE html>
<html>
<head>
    <title>Mockup Filtrage - Bases de Données</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif; background-color: #F5F5F5; margin: 0; padding: 20px; color: #333; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 98%; margin: 0 auto; }
        h3 { color: #1A1A1A; border-bottom: 2px solid #F27A00; padding-bottom: 10px; margin-top: 10px; font-weight: 600; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 14px; }
        th { background: #1A1A1A; color: white; padding: 12px 15px; font-weight: 500; text-align: left; border-top: 3px solid #F27A00; font-size: 13px; text-transform: uppercase; position: relative; }
        td { padding: 10px 15px; border-bottom: 1px solid #eee; color: #444; }
        tbody tr:nth-child(even) { background-color: #fafafa; }
        tbody tr:hover { background-color: #fff8f0; }

        /* Styles du Filtre */
        .filter-icon { 
            cursor: pointer; 
            color: #888; 
            margin-right: 8px; 
            font-size: 11px; 
            transition: color 0.2s;
        }
        .filter-icon:hover { color: white; }
        .filter-active { color: #F27A00; font-weight: bold; } /* Couleur quand un filtre est actif */
        
        .filter-menu {
            position: absolute; 
            background: white; 
            color: #333; 
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            padding: 5px 0; 
            z-index: 1000;
            max-height: 250px; 
            overflow-y: auto; 
            font-size: 13px; 
            font-weight: normal;
            text-transform: none;
            min-width: 150px;
        }
        .filter-menu div { padding: 8px 15px; cursor: pointer; transition: background 0.2s; }
        .filter-menu div:hover { background: #f0f7ff; color: #0078D4; }
        .filter-menu hr { margin: 5px 0; border: 0; border-top: 1px solid #eee; }

        /* Progress bars factices pour la démo */
        .progress-container { display: flex; align-items: center; gap: 8px; }
        .progress-bg { background: #eee; height: 12px; border-radius: 6px; flex: 1; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 6px; }
        .progress-text { font-weight: bold; font-size: 11px; min-width: 35px; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <h3>&Eacute;tat des Bases de Donn&eacute;es (Mockup avec Filtres dynamiques)</h3>
        <table id="dbt">
            <thead>
                <tr>
                    <th>Serveur</th>
                    <th>Base</th>
                    <th>Bo&icirc;tes</th>
                    <th>Taille DB</th>
                    <th>DB Libre</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>EXCH-PAR-01</td>
                    <td>DB-VIP-01</td>
                    <td>450</td>
                    <td>540.00 GB</td>
                    <td>
                        <div class='progress-container'><div class='progress-bg'><div class='progress-bar' style='width:65%;background:#2e7d32;'></div></div><div class='progress-text'>65%</div></div>
                    </td>
                </tr>
                <tr>
                    <td>EXCH-PAR-01</td>
                    <td>DB-USERS-01</td>
                    <td>1200</td>
                    <td>1024.00 GB</td>
                    <td>
                        <div class='progress-container'><div class='progress-bg'><div class='progress-bar' style='width:15%;background:#ff9800;'></div></div><div class='progress-text'>15%</div></div>
                    </td>
                </tr>
                <tr>
                    <td>EXCH-LON-02</td>
                    <td>DB-PROD-04</td>
                    <td>2200</td>
                    <td>2090.00 GB</td>
                    <td>
                        <div class='progress-container'><div class='progress-bg'><div class='progress-bar' style='width:45%;background:#2e7d32;'></div></div><div class='progress-text'>45%</div></div>
                    </td>
                </tr>
                <tr>
                    <td>EXCH-PAR-02</td>
                    <td>DB-TEMP-99</td>
                    <td>150</td>
                    <td>75.00 GB</td>
                    <td>
                        <div class='progress-container'><div class='progress-bg'><div class='progress-bar' style='width:8%;background:#d32f2f;'></div></div><div class='progress-text'>8%</div></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Logique de Filtrage Client-Side
        function initFilters(tableId) {
            const table = document.getElementById(tableId);
            const headers = table.querySelectorAll('th');
            const tbody = table.querySelector('tbody');
            
            // Sauvegarder les lignes originales pour pouvoir réappliquer les filtres
            table.originalRows = Array.from(tbody.querySelectorAll('tr'));
            table.activeFilters = {}; // { indexColonne: 'Valeur sélectionnée' }

            headers.forEach((th, index) => {
                // Création de l'icône de filtre (Flèche)
                const icon = document.createElement('span');
                icon.className = 'filter-icon';
                icon.innerHTML = '▼';
                icon.title = "Filtrer cette colonne";
                
                // Au clic, afficher le menu avec les valeurs récupérées de la colonne
                icon.onclick = function(e) {
                    e.stopPropagation();
                    showFilterMenu(table, th, index, icon);
                };
                
                // Insérer la flèche au début du titre de la colonne
                th.insertBefore(icon, th.firstChild);
            });
        }

        function showFilterMenu(table, th, colIndex, icon) {
            // Fermer tout menu existant
            let existing = document.querySelector('.filter-menu');
            if (existing) existing.remove();

            // 1. Analyse et récupération des valeurs uniques de la colonne
            const values = new Set();
            table.originalRows.forEach(row => {
                const cell = row.cells[colIndex];
                if(cell) {
                    // Utilisation de .innerText qui extrait le texte pur (ignore l'HTML interne comme les barres de progression)
                    values.add(cell.innerText.trim());
                }
            });

            // 2. Création du menu déroulant
            const menu = document.createElement('div');
            menu.className = 'filter-menu';

            // Option pour effacer le filtre
            const allOpt = document.createElement('div');
            allOpt.innerHTML = '<i>&times; Effacer le filtre</i>';
            allOpt.onclick = () => applyFilter(table, colIndex, null, menu, icon);
            menu.appendChild(allOpt);
            
            menu.appendChild(document.createElement('hr'));

            // Options basées sur les valeurs récupérées
            Array.from(values).sort().forEach(val => {
                const opt = document.createElement('div');
                opt.innerText = val;
                
                // Mettre en gras si cette valeur est actuellement filtrée
                if(table.activeFilters[colIndex] === val) {
                    opt.style.fontWeight = 'bold';
                    opt.style.color = '#F27A00';
                    opt.style.backgroundColor = '#f0f7ff';
                }
                
                opt.onclick = () => applyFilter(table, colIndex, val, menu, icon);
                menu.appendChild(opt);
            });

            // Positionner le menu sous le titre
            document.body.appendChild(menu);
            const rect = th.getBoundingClientRect();
            menu.style.top = (rect.bottom + window.scrollY) + 'px';
            menu.style.left = (rect.left + window.scrollX) + 'px';

            // Fermer le menu si on clique ailleurs
            setTimeout(() => {
                document.onclick = function(e) {
                    if (!menu.contains(e.target)) {
                        menu.remove();
                        document.onclick = null;
                    }
                };
            }, 0);
        }

        function applyFilter(table, colIndex, value, menu, icon) {
            // Mise à jour de l'état des filtres
            if (value === null) {
                delete table.activeFilters[colIndex];
                icon.classList.remove('filter-active'); // Flèche grise
            } else {
                table.activeFilters[colIndex] = value;
                icon.classList.add('filter-active'); // Flèche orange (filtre actif)
            }
            
            // Appliquer le filtrage sur le DOM
            const tbody = table.querySelector('tbody');
            tbody.innerHTML = ''; // Vider le tableau
            
            table.originalRows.forEach(row => {
                let show = true;
                // Vérifier la ligne contre tous les filtres actifs (Filtre croisé / multi-colonnes)
                for (const [cIdx, val] of Object.entries(table.activeFilters)) {
                    if (row.cells[cIdx].innerText.trim() !== val) {
                        show = false; 
                        break;
                    }
                }
                if (show) tbody.appendChild(row);
            });
            
            menu.remove();
        }

        // Initialisation du filtre sur le tableau dbt
        initFilters('dbt');
    </script>
</body>
</html>
